name: Job Hunter QA

on:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "main.py"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate Python syntax
        run: python -m py_compile main.py tests/test_automation.py
      - name: Run automated tests
        run: python -m unittest discover -s tests -v
