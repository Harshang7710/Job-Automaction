name: Daily Morning Job Hunter

on:
  schedule:
    # 04:37 UTC corresponds to 10:07 AM IST
    - cron: '37 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-job-hunter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m py_compile main.py

      - name: Restore LinkedIn alert state
        uses: actions/cache/restore@v4
        with:
          path: .linkedin_alert_state.json
          key: linkedin-alerts-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            linkedin-alerts-${{ runner.os }}-

      - name: Execute Daily Job Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          EMAIL_CC: ${{ secrets.EMAIL_CC }}
          LINKEDIN_ALERT_EMAIL: ${{ secrets.LINKEDIN_ALERT_EMAIL }}
          LINKEDIN_ALERT_APP_PASSWORD: ${{ secrets.LINKEDIN_ALERT_APP_PASSWORD }}
        run: python main.py

      - name: Save LinkedIn alert state
        if: ${{ always() && hashFiles('.linkedin_alert_state.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .linkedin_alert_state.json
          key: linkedin-alerts-${{ runner.os }}-${{ github.run_id }}
